<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b1b" />
    <meta name="description" content="Uma pequena declaração para o amor da minha vida." />
    <title>Eu te amo</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="pagina-amor">
      <div class="brilho brilho-um"></div>
      <div class="brilho brilho-dois"></div>
      <div class="estrelas" aria-hidden="true"></div>

      <section class="intro-amor" id="intro-amor" aria-label="Eu te amo">
        <span class="intro-sobretitulo">uma mensagem para você</span>
        <div class="intro-titulo-linha">
          <svg class="icone-coracao" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
          <p class="titulo-intro">Eu te amo</p>
        </div>
        <span class="linha-intro" aria-hidden="true"></span>
      </section>

      <section class="story-overlay" id="story-overlay" aria-label="Vídeo de abertura" hidden>
        <div class="story-frame">
          <video
            class="story-video"
            id="video-abertura"
            src="./videos/abertura.mp4"
            controls
            autoplay
            muted
            playsinline
            preload="auto"
          ></video>
          <div class="story-sombra" aria-hidden="true"></div>
          <div class="story-topo" aria-hidden="true"><span class="story-progresso"></span><span>Nosso amor</span></div>
          <button class="fechar-story" id="fechar-abertura" type="button" aria-label="Fechar vídeo e ver as lembranças">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <button class="ativar-som-story" id="ativar-som-story" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6l-5 4H5Zm12-1.5c1.3 1.3 1.3 5.7 0 7"/></svg>
            <span>Ativar som</span>
          </button>
          <button class="iniciar-story" id="iniciar-story" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg>
            <span>Reproduzir vídeo</span>
          </button>
        </div>
      </section>

      <section class="conteudo" id="conteudo" aria-labelledby="titulo-principal" hidden>
        <div class="mensagem">
          <span class="sobretitulo entrada-um">para o amor da minha vida</span>
          <div class="titulo-linha entrada-dois">
            <svg class="icone-coracao pequeno" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
            <h1 id="titulo-principal">Eu te amo</h1>
          </div>
          <p class="declaracao entrada-tres">Em cada lembrança, em cada sorriso e em todos os momentos que ainda vamos viver.</p>
          <div class="assinatura entrada-quatro" aria-hidden="true"><span></span><strong>nós dois, sempre</strong></div>
        </div>

        <div class="album entrada-cinco" id="album">
          <div id="galeria">
            <div class="moldura">
              <div class="slides" id="slides" aria-live="polite">
                <div class="vinheta"></div>
                <span class="tipo-midia" id="tipo-midia">foto</span>
                <span class="contador" id="contador">01 / 47</span>
              </div>
              <button class="seta anterior" id="anterior" type="button" aria-label="Lembrança anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
              </button>
              <button class="seta proxima" id="proxima" type="button" aria-label="Próxima lembrança">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
              </button>
            </div>
            <div class="controles" id="controles" aria-label="Escolher lembrança"></div>
          </div>
        </div>
      </section>

      <div class="rodape entrada-seis" id="rodape" hidden>
        <svg class="icone-coracao pequeno" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
        <span>Feito com amor</span>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
