<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b1b" />
    <meta name="description" content="Uma pequena declaração para o amor da minha vida." />
    <title>Eu te amo</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="pagina-amor">
      <div class="brilho brilho-um"></div>
      <div class="brilho brilho-dois"></div>
      <div class="estrelas" aria-hidden="true"></div>

      <section class="conteudo" aria-labelledby="titulo-principal">
        <div class="mensagem">
          <span class="sobretitulo entrada-um">para o amor da minha vida</span>
          <div class="titulo-linha entrada-dois">
            <svg class="icone-coracao pequeno" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
            <h1 id="titulo-principal">Eu te amo</h1>
          </div>
          <p class="declaracao entrada-tres">Em cada lembrança, em cada sorriso e em todos os momentos que ainda vamos viver.</p>
          <div class="assinatura entrada-quatro" aria-hidden="true"><span></span><strong>nós dois, sempre</strong></div>
        </div>

        <div class="album entrada-cinco" id="album">
          <div class="moldura moldura-abertura" id="abertura" aria-label="Vídeo de abertura">
            <div class="slides palco-abertura">
              <video
                class="video-abertura"
                id="video-abertura"
                src="https://drive.usercontent.google.com/download?id=19RVtHDgT4-FL3T4mgcM5rL6zJx6YIkOC&export=download&confirm=t"
                controls
                autoplay
                playsinline
                preload="metadata"
              ></video>
              <div class="vinheta vinheta-abertura"></div>
              <div class="legenda-abertura">
                <svg class="icone-coracao pequeno" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
                <span>Nosso vídeo de abertura</span>
              </div>
            </div>
            <button class="fechar-abertura" id="fechar-abertura" type="button" aria-label="Fechar vídeo e ver as lembranças">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              <span>Ver lembranças</span>
            </button>
          </div>

          <div id="galeria" hidden>
            <div class="moldura">
              <div class="slides" id="slides" aria-live="polite">
                <div class="vinheta"></div>
                <span class="tipo-midia" id="tipo-midia">foto</span>
                <span class="contador" id="contador">01 / 47</span>
              </div>
              <button class="seta anterior" id="anterior" type="button" aria-label="Lembrança anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
              </button>
              <button class="seta proxima" id="proxima" type="button" aria-label="Próxima lembrança">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
              </button>
            </div>
            <div class="controles" id="controles" aria-label="Escolher lembrança"></div>
          </div>
        </div>
      </section>

      <div class="rodape entrada-seis">
        <svg class="icone-coracao pequeno" viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54S5 39 5 18C5 8 17 2 26 10l6 6 6-6c9-8 21-2 21 8 0 21-27 36-27 36Z"/></svg>
        <span>Feito com amor</span>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
